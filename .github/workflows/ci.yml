name: Test CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Add Go bin to PATH
      shell: pwsh
      run: Add-Content -Path $env:GITHUB_PATH -Value ((go env GOPATH) + "\bin")

    - name: Install Task
      run: go install github.com/go-task/task/v3/cmd/task@latest

    - name: Install Wails3 CLI
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74

    - name: Build frontend
      # assets.go embeds frontend/dist (`//go:embed all:frontend/dist`), so the
      # root and cmd/gui packages fail to even compile for `go test` without it.
      run: task common:build:frontend

    - name: Run tests
      run: go test ./...